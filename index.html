.tbl{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;font-size:.95rem}
.scroll{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}

footer{border-top:1px solid var(--line);padding:30px 0;color:var(--doux);font-size:.9rem;text-align:center}

.gd{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}

.tag{background:var(--line);border-radius:99px;padding:1px 11px;font:600 .8rem var(--sans)}
.lnk{background:var(--acc);color:#140c00;border:0;border-radius:99px;padding:6px 16px;font:800 .9rem var(--sans);cursor:pointer;justify-self:start}
.panel.on{display:block}
