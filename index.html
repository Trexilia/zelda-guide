<style>

*{box-sizing:border-box;margin:0}

body[data-cat=home] #home,body[data-cat=all] #all,body[data-cat=mm] #mm,body[data-cat=tp] #tp{display:block}
.hero{text-align:center;padding:76px 0 56px}

.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;margin-bottom:70px}
.big{text-align:left;border:2px solid var(--line);border-radius:14px;padding:30px;cursor:pointer;color:var(--os);font:inherit}
.big h2{font:900 1.9rem var(--serif);margin-bottom:8px}
.big p{color:var(--doux)}

.big.mm span{color:#9be36f}.big.tp span{color:#5ee6d8}
section.s{padding:52px 0;border-top:1px solid var(--line)}
.cathead{padding:56px 0 34px}
h2.t{font:700 clamp(1.5rem,4vw,2.1rem) var(--serif);color:var(--acc);margin-bottom:6px}
.lead{color:var(--doux);max-width:660px;margin-bottom:26px}
h3{font:700 1.12rem var(--serif);color:var(--acc2);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.card .k{color:var(--doux);font-size:.9rem}
.steps{counter-reset:s;display:grid;gap:12px;list-style:none;padding:0}
.steps li{counter-increment:s;background:var(--card);border-left:4px solid var(--acc);border-radius:10px;padding:14px 18px 14px 62px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:18px;top:8px;font:900 1.7rem var(--serif);color:var(--acc)}
.steps b{display:block;color:var(--os)}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;font-size:.95rem}
.scroll{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
.tbl th,.tbl td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--acc);font:700 .95rem var(--serif);background:color-mix(in srgb,var(--card) 70%,var(--bg))}
.tbl tr:last-child td{border:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.filters button{background:var(--card);color:var(--os);border:1px solid var(--line);border-radius:99px;padding:6px 15px;font:600 .9rem var(--sans);cursor:pointer}
.filters button[aria-pressed=true]{background:var(--acc2);color:#04201d;border-color:var(--acc2)}
.hide{display:none!important}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .4s}
.pct{font:700 1.4rem var(--serif);color:var(--acc);margin-bottom:14px}
.check h3{margin:20px 0 2px}
.check label{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--acc);margin-top:4px;flex:none}
.reset{background:none;border:1px solid var(--doux);color:var(--doux);border-radius:99px;padding:6px 16px;cursor:pointer;margin-top:16px}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--doux);font-size:.9rem;text-align:center}
body[data-cat=all]{--bg:#0c1a17;--card:#132a25;--line:#22463d;--acc:#e8c25a;--acc2:#6ee0b8}

.chip:hover{border-color:var(--acc2);color:var(--acc2)}
.chip small{color:var(--doux);display:block;font-weight:400}
.line{border-left:3px solid var(--acc);padding-left:14px;margin:0 0 6px 8px}
.gd{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}

.gd summary small{margin-left:auto;font:600 .82rem var(--sans);color:var(--doux)}
.gd .in{padding:0 18px 18px;display:grid;gap:10px}
.gd ul{padding-left:20px}.gd h4{color:var(--acc2);font:700 .98rem var(--serif)}
.tag{background:var(--line);border-radius:99px;padding:1px 11px;font:600 .8rem var(--sans)}
.lnk{background:var(--acc);color:#140c00;border:0;border-radius:99px;padding:6px 16px;font:800 .9rem var(--sans);cursor:pointer;justify-self:start}
.panel.on{display:block}

body[data-cat=la]{--bg:#0e1c22;--card:#15303a;--line:#26525f;--acc:#f0d060;--acc2:#7fe0d0}
body[data-cat=ss]{--bg:#10192a;--card:#182642;--line:#2b4373;--acc:#f0c85a;--acc2:#8fd0ff}
body[data-cat=eow]{--bg:#151322;--card:#1f1c33;--line:#3a3560;--acc:#f0b0dc;--acc2:#8fe0e8}
body[data-cat=loz]{--bg:#101410;--card:#1a221a;--line:#2f412f;--acc:#e8c25a;--acc2:#7fd68a}
body[data-cat=aol]{--bg:#1a1410;--card:#2a2016;--line:#4a3826;--acc:#f0b04a;--acc2:#c8a0ff}
body[data-cat=mc]{--bg:#0f1c14;--card:#17301f;--line:#2b5c3a;--acc:#f2d060;--acc2:#7fe0a0}

function mapSec(k,d){if(!d.map)return '';
var pins=d.map.map(function(m,i){return '<g class="pin t'+m[3]+'" data-i="'+i+'" tabindex="0" role="button" aria-label="'+m[2]+'" transform="translate('+m[0]+' '+m[1]+')"><circle r="3.2"/><text y="1.1">'+(i+1)+'</text></g>'}).join('');
var lst=d.map.map(function(m,i){return '<button class="chip" data-i="'+i+'">'+(i+1)+'. '+m[2]+'<small>'+({d:'Donjon',v:'Lieu',s:'Secret ou quête'})[m[3]]+'</small></button>'}).join('');
return '<section class="s" id="'+k+'-map"><div class="wrap"><h2 class="t">Carte interactive</h2><p class="lead">Schéma des lieux clés, non à l\'échelle. Rouge : donjon. Couleur claire : lieu. Couleur d\'accent : secret ou quête.</p><svg class="map" viewBox="0 0 100 60" aria-label="Carte de '+d.name+'"><defs><pattern id="gp'+k+'" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="var(--line)" stroke-width=".25"/></pattern></defs><rect width="100" height="60" fill="url(#gp'+k+')"/>'+pins+'</svg><div class="card mi" aria-live="polite"><p>Sélectionne un point sur la carte ou dans la liste.</p></div><div class="plist">'+lst+'</div></div></section>'}
function initMap(box,k,d){if(!d.map)return;var st='zelda-map-'+k,v={};try{v=JSON.parse(localStorage.getItem(st)||'{}')}catch(e){}
var pins=box.querySelectorAll('.pin'),chips=box.querySelectorAll('.plist .chip'),mi=box.querySelector('.mi');
function paint(){pins.forEach(function(p,i){p.classList.toggle('vis',!!v[i])});chips.forEach(function(c,i){c.style.opacity=v[i]?.55:1})}
function sel(i){var m=d.map[i];pins.forEach(function(p,j){p.classList.toggle('on',i===j)});mi.innerHTML='<h3>'+(i+1)+'. '+m[2]+'</h3><p>'+m[4]+'</p><label style="display:flex;gap:8px;margin-top:8px;cursor:pointer"><input type="checkbox" '+(v[i]?'checked':'')+' style="width:18px;height:18px;accent-color:var(--acc)"> Visité</label>';
mi.querySelector('input').addEventListener('change',function(e){v[i]=e.target.checked;try{localStorage.setItem(st,JSON.stringify(v))}catch(x){}paint()})}
