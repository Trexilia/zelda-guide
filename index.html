<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyrule Compagnon — Majora's Mask et Twilight Princess</title>
<meta name="description" content="Guides complets pour finir Majora's Mask et Twilight Princess : pas à pas, donjons, secrets, fun facts et checklist.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Marcellus&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d181d;--card:#152730;--line:#1f3a45;--acc:#e8b84a;--acc2:#5be0e8;--os:#e8efe8;--doux:#9db4b8;--serif:'Cinzel',Georgia,serif;--sans:'Nunito Sans',system-ui,sans-serif}
body[data-cat=mm]{--bg:#120d24;--card:#1d1638;--line:#33285e;--acc:#f2a33a;--acc2:#9be36f;--doux:#b3a9d6;--serif:'Cinzel',Georgia,serif}
body[data-cat=tp]{--bg:#0c1114;--card:#161f24;--line:#2a3a42;--acc:#ff7a3d;--acc2:#5ee6d8;--doux:#9fb2b8;--serif:'Marcellus',Georgia,serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{background:var(--bg);color:var(--os);font:400 1.05rem/1.7 var(--sans)}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.wrap{max-width:1000px;margin:auto;padding:0 20px}
.top{position:sticky;top:0;z-index:9;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;gap:8px;align-items:center;padding-block:10px;flex-wrap:wrap}
.brand{font:900 1.05rem var(--serif);color:var(--acc);margin-right:auto;background:none;border:0;cursor:pointer}
.cat{border:2px solid var(--line);background:none;color:var(--os);font:700 .95rem var(--sans);padding:7px 18px;border-radius:99px;cursor:pointer}
.cat[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#140c00}
.sub{border-top:1px solid var(--line);display:none}
body:not([data-cat=home]) .sub{display:block}
.sub .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:6px}
.sub button{background:none;border:0;color:var(--os);font:600 .9rem var(--sans);padding:6px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
.sub button:hover{background:var(--line);color:var(--acc2)}
.panel{display:none}
body[data-cat=home] #home,body[data-cat=mm] #mm,body[data-cat=tp] #tp{display:block}
.hero{text-align:center;padding:76px 0 56px}
h1{font:900 clamp(2.1rem,6vw,3.6rem)/1.1 var(--serif);color:var(--acc)}
.hero p{max-width:600px;margin:16px auto 0;color:var(--doux);font-size:1.12rem}
.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;margin-bottom:70px}
.big{text-align:left;border:2px solid var(--line);border-radius:14px;padding:30px;cursor:pointer;color:var(--os);font:inherit}
.big h2{font:900 1.9rem var(--serif);margin-bottom:8px}
.big p{color:var(--doux)}
.big.mm{background:linear-gradient(160deg,#2a1f55,#120d24);border-color:#f2a33a}.big.mm h2{color:#f2a33a}
.big.tp{background:linear-gradient(160deg,#20303a,#0c1114);border-color:#ff7a3d}.big.tp h2{color:#ff7a3d}
.big span{display:inline-block;margin-top:14px;font-weight:800}
.big.mm span{color:#9be36f}.big.tp span{color:#5ee6d8}
section.s{padding:52px 0;border-top:1px solid var(--line)}
.cathead{padding:56px 0 34px}
h2.t{font:700 clamp(1.5rem,4vw,2.1rem) var(--serif);color:var(--acc);margin-bottom:6px}
.lead{color:var(--doux);max-width:660px;margin-bottom:26px}
h3{font:700 1.12rem var(--serif);color:var(--acc2);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.card .k{color:var(--doux);font-size:.9rem}
.steps{counter-reset:s;display:grid;gap:12px;list-style:none;padding:0}
.steps li{counter-increment:s;background:var(--card);border-left:4px solid var(--acc);border-radius:10px;padding:14px 18px 14px 62px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:18px;top:8px;font:900 1.7rem var(--serif);color:var(--acc)}
.steps b{display:block;color:var(--os)}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;font-size:.95rem}
.scroll{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
.tbl th,.tbl td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--acc);font:700 .95rem var(--serif);background:color-mix(in srgb,var(--card) 70%,var(--bg))}
.tbl tr:last-child td{border:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.filters button{background:var(--card);color:var(--os);border:1px solid var(--line);border-radius:99px;padding:6px 15px;font:600 .9rem var(--sans);cursor:pointer}
.filters button[aria-pressed=true]{background:var(--acc2);color:#04201d;border-color:var(--acc2)}
.hide{display:none!important}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .4s}
.pct{font:700 1.4rem var(--serif);color:var(--acc);margin-bottom:14px}
.check h3{margin:20px 0 2px}
.check label{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--acc);margin-top:4px;flex:none}
.reset{background:none;border:1px solid var(--doux);color:var(--doux);border-radius:99px;padding:6px 16px;cursor:pointer;margin-top:16px}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--doux);font-size:.9rem;text-align:center}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar i{transition:none}}
</style>
</head>
<body data-cat="home">
<header class="top"><div class="wrap">
<button class="brand" data-go="home">Hyrule Compagnon</button>
<button class="cat" data-go="mm" aria-pressed="false">Majora's Mask</button>
<button class="cat" data-go="tp" aria-pressed="false">Twilight Princess</button>
</div><div class="sub"><div class="wrap" id="sub"></div></div></header>

<main>
<div class="panel" id="home"><div class="wrap">
<div class="hero"><h1>Hyrule Compagnon</h1><p>Deux jeux, deux guides complets. Choisis ta catégorie pour finir l'aventure sans te perdre.</p></div>
<div class="choose">
<button class="big mm" data-go="mm"><h2>Majora's Mask</h2><p>Trois jours, une lune qui tombe, 24 masques. Le Zelda le plus étrange de la saga.</p><span>Ouvrir le guide</span></button>
<button class="big tp" data-go="tp"><h2>Twilight Princess</h2><p>Un Hyrule plongé dans le crépuscule, un héros loup et la mystérieuse Midna.</p><span>Ouvrir le guide</span></button>
</div></div></div>
<div class="panel" id="mm"></div>
<div class="panel" id="tp"></div>
</main>
<footer><div class="wrap">Site de fans, non affilié à Nintendo. The Legend of Zelda est une marque de Nintendo.</div></footer>

<script>
var D={
mm:{name:"Majora's Mask",
intro:"Link arrive à Termina, un monde parallèle. Skull Kid, armé du masque de Majora, fait tomber la lune en trois jours. Tu remontes le temps à volonté pour tout arranger.",
fiche:[["Sortie","2000, Nintendo 64"],["Remake","Majora's Mask 3D (3DS, 2015)"],["Durée","≈ 25 h histoire, 40 h et plus à 100 %"],["Réalisation","Eiji Aonuma, Yoshiaki Koizumi"]],
steps:[["Clock Town, jour 1","Récupère l'Ocarina auprès du vendeur de masques, joue le Chant de la guérison et obtiens le Masque Mojo. Remonte ensuite le temps avec le Chant du temps."],["Prends le rythme","Apprends tôt le Chant du double temps (sauter d'une demi-journée) et le Chant du temps inversé (ralentir le temps)."],["Marais du Sud","Temple de la Forêt (Woodfall), boss Odolwa. Tu obtiens l'arc et libères le premier géant."],["Montagne des neiges","Deviens Goron, ouvre le Temple de Snowhead. Boss Goht, flèches de feu."],["Baie des Zoras","Deviens Zora, franchis le Temple de la Grande Baie. Boss Gyorg, flèches de glace."],["Canyon d'Ikana","Temple de la Tour de Pierre, à retourner à l'envers. Boss Twinmold."],["Apprends le Serment à l'ordre","Réveille les quatre géants pour les invoquer, puis monte sur la lune."],["Finale","Affronte Majora en trois formes. Avec les 20 masques normaux, l'enfant de la lune te donne le masque du Dieu féroce."]],
dj:[["Woodfall","Odolwa","Arc des héros","Les fées perdues sont dans l'eau et dans les fleurs."],["Snowhead","Goht","Flèches de feu","Utilise la vitesse en boule de Goron."],["Great Bay","Gyorg","Flèches de glace","Change le sens du courant pour avancer."],["Stone Tower","Twinmold","Flèches de lumière","Retourne le temple avec l'interrupteur en forme d'œil."]],
sec:[["Masques","24 au total : 4 de transformation (Mojo, Goron, Zora, Dieu féroce) et de nombreux masques utiles."],["Fées perdues","15 par temple, plus les grandes fées qui offrent capacités et améliorations."],["Quêtes des habitants","Le Carnet des Bombers et l'histoire d'Anju et Kafei donnent les récompenses les plus riches."],["Quarts de cœur","52 quarts de cœur et 4 réceptacles : ils permettent d'atteindre 20 cœurs."]],
facts:[["saga","Développé en un an","Le jeu a été fait en environ un an, en réutilisant le moteur d'Ocarina of Time."],["jeu","Extension mémoire requise","Le jeu demandait l'Expansion Pak pour tourner sur Nintendo 64."],["monde","Termina n'est pas Hyrule","Link y arrive en cherchant un ami disparu. Il n'y a ni Zelda ni Triforce au premier plan."],["jeu","Une boucle de 3 jours","Le compte à rebours dure 72 heures de jeu, soit environ 54 minutes réelles par cycle."],["monde","Le Masque de Majora","Une entité maléfique liée au masque est la vraie menace, pas Skull Kid seul."],["saga","Un jeu à part","Ses thèmes, comme le deuil et l'angoisse, en font l'un des Zelda les plus sombres."]],
check:[["Marais du Sud",["Finir le Temple de la Forêt","Masque Mojo et masque de cerf"]],["Autres régions",["Finir Snowhead","Finir la Grande Baie","Finir la Tour de Pierre"]],["Secrets",["Récupérer les 24 masques","Trouver toutes les fées perdues","Compléter le carnet des Bombers"]],["Finale",["Apprendre le Serment à l'ordre","Battre Majora"]]]},
tp:{name:"Twilight Princess",
intro:"Un crépuscule envahit Hyrule. Link se transforme en loup dans les zones d'ombre, guidé par Midna. Son but : dissiper le sortilège de Zant et de Ganondorf.",
fiche:[["Sortie","2006, GameCube et Wii"],["Remake","Twilight Princess HD (Wii U, 2016)"],["Durée","≈ 35 h histoire, 60 h et plus à 100 %"],["Réalisation","Eiji Aonuma, Yoshiaki Koizumi"]],
steps:[["Village d'Ordon","Fais les petites quêtes du village. Elles t'apprennent les bases avant que Link ne se transforme."],["Forêt de Firone","Récupère les Larmes de lumière contre l'ombre, puis le Temple de la Forêt. Boss Diababa, boomerang."],["Éldin","Mines des Gorons, boss Fyrus, bottes de fer. Puis on avance vers Kakariko."],["Lanelle","Temple du Lac, boss Morpheel, grappin. Passe par le domaine des Zoras."],["Le Bois Sacré","Retire la Master Sword : elle demande de vaincre les premiers temples."],["Terres du désert","Arbiter's Grounds, boss Stallord, toupie. Puis Pic enneigé, boss Blizzeta, boulet."],["Temple du Temps","Boss Armogohma, bâton de domination. Puis la Cité céleste, boss Argorok, double grappin."],["Finale","Palais du Crépuscule (Zant), puis château d'Hyrule et affrontement de Ganondorf."]],
dj:[["Temple de la Forêt","Diababa","Boomerang de vent","Coupe les singes puis arrête les fleurs."],["Mines des Gorons","Fyrus","Bottes de fer","Aimants et bottes pour monter."],["Temple du Lac","Morpheel","Grappin","Contrôle le niveau d'eau."],["Arbiter's Grounds","Stallord","Toupie","Suis les rails de toupie."],["Ruines du Pic","Blizzeta","Boulet","Utilise la chaîne pour briser la glace."],["Temple du Temps","Armogohma","Bâton de domination","Fais avancer la statue avec le bâton."],["Cité céleste","Argorok","Double grappin","Monte étage par étage avec les grappins."]],
sec:[["Insectes d'or","24 en tout : rapporte-les à Agitha contre des rubis et des bonus."],["Âmes de Poe","60 âmes à collecter, que Jovani échange contre des rubis et des récompenses."],["Quarts de cœur","45 en tout, jusqu'à 20 cœurs avec les réceptacles."],["Techniques cachées","7 techniques enseignées par le héros fantôme, comme le Coup fatal et la Grande spirale."],["Grotte des épreuves","50 étages à la fin du jeu pour récompense spéciale."]],
facts:[["saga","D'abord GameCube","Le jeu était prévu sur GameCube avant d'être aussi adapté à la Wii."],["jeu","Version Wii en miroir","Sur Wii, le monde est inversé pour que Link soit droitier."],["monde","Midna","Le jeu gagne beaucoup de sa profondeur grâce à ce personnage plein de secrets."],["jeu","Link en loup","Le loup sent les trésors enfouis et communique avec les esprits."],["saga","Après Majora's Mask","Dans la chronologie officielle, il suit Ocarina et Majora dans la branche de l'enfant."],["monde","Les larmes de lumière","Chaque région t'oblige à chasser des insectes d'ombre pour rendre sa lumière à un esprit."]],
check:[["Ordon et Firone",["Finir Ordon","Finir le Temple de la Forêt","Débloquer les larmes de lumière"]],["Milieu de partie",["Finir les Mines des Gorons","Finir le Temple du Lac","Prendre la Master Sword"]],["Fin d'aventure",["Finir la Cité céleste","Finir le Palais du Crépuscule","Battre Ganondorf"]],["100 %",["24 insectes d'or","60 âmes de Poe","45 quarts de cœur","7 techniques cachées"]]]}
};
var SUBS=[["pres","Présentation"],["guide","Guide pas à pas"],["dj","Donjons"],["sec","Secrets"],["facts","Fun facts"],["suivi","Ma progression"]];
function h(t,c,x){return '<'+t+(c?' class="'+c+'"':'')+(x||'')+'>'}
function render(k){
var d=D[k],o='';
o+=h('section','cathead')+'<div class="wrap"><h1>'+d.name+'</h1><p class="lead" style="margin-top:12px;margin-bottom:0">'+d.intro+'</p></div></section>';
o+=h('section','s','id="'+k+'-pres"')+'<div class="wrap"><h2 class="t">Présentation</h2><div class="grid">'+d.fiche.map(function(f){return '<div class="card"><div class="k">'+f[0]+'</div><h3 style="color:var(--os)">'+f[1]+'</h3></div>'}).join('')+'</div></div></section>';
o+=h('section','s','id="'+k+'-guide"')+'<div class="wrap"><h2 class="t">Guide pas à pas</h2><p class="lead">L\'ordre conseillé pour finir le jeu.</p><ol class="steps">'+d.steps.map(function(s){return '<li><b>'+s[0]+'</b>'+s[1]+'</li>'}).join('')+'</ol></div></section>';
o+=h('section','s','id="'+k+'-dj"')+'<div class="wrap"><h2 class="t">Donjons</h2><p class="lead">Boss, objet obtenu et conseil.</p><div class="scroll"><table class="tbl"><tr><th>Donjon</th><th>Boss</th><th>Objet</th><th>Conseil</th></tr>'+d.dj.map(function(r){return '<tr><td>'+r.join('</td><td>')+'</td></tr>'}).join('')+'</table></div></div></section>';
o+=h('section','s','id="'+k+'-sec"')+'<div class="wrap"><h2 class="t">Secrets et collectibles</h2><div class="grid">'+d.sec.map(function(s){return '<div class="card"><h3>'+s[0]+'</h3><p>'+s[1]+'</p></div>'}).join('')+'</div></div></section>';
o+=h('section','s','id="'+k+'-facts"')+'<div class="wrap"><h2 class="t">Fun facts</h2><div class="filters" role="group" aria-label="Filtrer" data-k="'+k+'"><button aria-pressed="true" data-f="all">Tous</button><button aria-pressed="false" data-f="saga">La saga</button><button aria-pressed="false" data-f="jeu">Gameplay</button><button aria-pressed="false" data-f="monde">Monde et lore</button></div><div class="grid">'+d.facts.map(function(f){return '<div class="card fact" data-t="'+f[0]+'"><h3>'+f[1]+'</h3><p>'+f[2]+'</p></div>'}).join('')+'</div></div></section>';
o+=h('section','s','id="'+k+'-suivi"')+'<div class="wrap"><h2 class="t">Ma progression</h2><p class="lead">Coche ce que tu as fait. C\'est enregistré sur cet appareil.</p><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div><div class="pct">0 %</div><div class="check">'+d.check.map(function(g,gi){return '<h3>'+g[0]+'</h3>'+g[1].map(function(t,ti){return '<label><input type="checkbox" data-id="'+gi+'-'+ti+'">'+t+'</label>'}).join('')}).join('')+'</div><button class="reset">Réinitialiser</button></div></section>';
document.getElementById(k).innerHTML=o;
var box=document.getElementById(k),store='zelda-'+k,saved={};
try{saved=JSON.parse(localStorage.getItem(store)||'{}')}catch(e){}
var ins=box.querySelectorAll('.check input');
function upd(){var c=box.querySelectorAll('.check input:checked').length,p=Math.round(c/ins.length*100);box.querySelector('.bar i').style.width=p+'%';box.querySelector('.pct').textContent=p+' %';box.querySelector('.bar').setAttribute('aria-valuenow',p)}
function save(){try{localStorage.setItem(store,JSON.stringify(saved))}catch(e){}}
ins.forEach(function(i){i.checked=!!saved[i.dataset.id];i.addEventListener('change',function(){saved[i.dataset.id]=i.checked;save();upd()})});
box.querySelector('.reset').addEventListener('click',function(){saved={};save();ins.forEach(function(i){i.checked=false});upd()});
upd();
var fb=box.querySelectorAll('.filters button');
fb.forEach(function(b){b.addEventListener('click',function(){fb.forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');box.querySelectorAll('.fact').forEach(function(c){c.classList.toggle('hide',b.dataset.f!=='all'&&c.dataset.t!==b.dataset.f)})})});
}
render('mm');render('tp');
function go(k,skip){
document.body.dataset.cat=k;
document.querySelectorAll('.cat').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.go===k)});
var s=document.getElementById('sub');
s.innerHTML=k==='home'?'':SUBS.map(function(x){return '<button data-s="'+k+'-'+x[0]+'">'+x[1]+'</button>'}).join('');
document.title=(k==='home'?'Hyrule Compagnon':D[k].name+' — Hyrule Compagnon');
if(!skip){history.replaceState(null,'',k==='home'?'#':'#'+k)}
window.scrollTo(0,0);
}
document.addEventListener('click',function(e){
var g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
var s=e.target.closest('[data-s]');if(s){document.getElementById(s.dataset.s).scrollIntoView()}
});
var hh=location.hash.replace('#','');go(hh==='mm'||hh==='tp'?hh:'home',true);
</script>
</body>
</html>
